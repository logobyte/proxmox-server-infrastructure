name: Validate Portfolio

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    name: Validate Shell Scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bash syntax check
        run: |
          bash -n ec2/start.sh
          bash -n ec2/stop.sh
          bash -n ec2/monitor.sh
          bash -n s3/backup.sh
          bash -n s3/sync.sh

  terraform:
    name: Validate Terraform
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.0

      - name: Terraform format check
        working-directory: terraform
        run: terraform fmt -check

      - name: Terraform init
        working-directory: terraform
        run: terraform init -backend=false

      - name: Terraform validate
        working-directory: terraform
        run: terraform validate

  yaml:
    name: Validate YAML
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse CloudFormation YAML
        run: |
          python - <<'PY'
          import yaml
          with open("cloudformation/ec2.yaml", "r", encoding="utf-8") as f:
              yaml.safe_load(f)
          print("CloudFormation YAML parsed successfully.")
          PY
