AWSTemplateFormatVersion: '2010-09-09'
Description: Safe portfolio example for launching one EC2 instance.

Parameters:
  AmiId:
    Type: AWS::EC2::Image::Id
    Description: Select a valid AMI ID for your AWS region.

  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues:
      - t3.micro
      - t3.small
    Description: EC2 instance type.

Resources:
  PortfolioInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      Tags:
        - Key: Name
          Value: portfolio-demo
        - Key: Environment
          Value: portfolio
        - Key: ManagedBy
          Value: CloudFormation

Outputs:
  InstanceId:
    Description: EC2 instance ID.
    Value: !Ref PortfolioInstance
